# Override: rename all containers with -v2 suffix so v1 and v2 can run side by side.
# Also tune kasmweb/chrome for analyst use: 1080p desktop, 24fps cap, no audio stream.
services:
  etherhawk-ui:
    container_name: etherhawk-ui-v2
  etherhawk-api:
    container_name: etherhawk-api-v2
  etherhawk-interactive:
    container_name: etherhawk-interactive-v2
    environment:
      # 1920x1080 is in kasmweb's available modelist; 1280x720 is NOT and falls back
      # to 1024x768. Use 1080p so the analyst gets a full-quality desktop; noVNC
      # resize=scale in the iframe URL scales it to fit the panel without scrollbars.
      - VNC_RESOLUTION=1920x1080
      # 24fps is smooth for human-driven browsing and halves VNC stream bandwidth vs
      # the 60fps default. Already the base-image default; explicit here so it survives
      # any future base-image change.
      - MAX_FRAME_RATE=24
      # Disable the kasmweb audio stream — saves ~50-100 kbps of WebSocket bandwidth
      # that would otherwise compete with the VNC video stream.
      - DISABLE_AUDIO=1
  etherhawk-deobf:
    container_name: etherhawk-deobf-v2
  etherhawk-sandbox:
    container_name: etherhawk-sandbox-v2
