services:

  # ── Dashboard (CyberHawk-branded React SPA) ──────────────────────────────────
  etherhawk-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: etherhawk-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8080}:80"          # dashboard — put behind VPN/tunnel; token-guarded
    environment:
      # Used only to build the kasm Basic-Auth header for the noVNC proxy at start.
      - KASM_PASSWORD=${KASM_PASSWORD:-changeme-kasm}
    depends_on:
      etherhawk-api:
        condition: service_healthy
    networks:
      - etherhawk-net

  # ── Orchestrator API (deterministic pipeline, verdict engine, SQLite) ─────────
  etherhawk-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: etherhawk-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8094}:8000"   # localhost only; the UI proxies /api
    env_file:
      - .env
    environment:
      - WORKSPACE=/workspace
      - MITM_FLOWS_PATH=${MITM_FLOWS_PATH:-/workspace/_mitm/flows.jsonl}
      - INTERACTIVE_URL=${INTERACTIVE_URL:-http://etherhawk-interactive:9001}
      - DEOBFUSCATOR_URL=${DEOBFUSCATOR_URL:-http://etherhawk-deobf:3020/deobfuscate}
      - SANDBOX_URL=${SANDBOX_URL:-http://etherhawk-sandbox:3021/run}
      - KASM_PORT=${KASM_PORT:-6901}
    volumes:
      - etherhawk-data:/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - etherhawk-net          # reach interactive browser + deobf + ui
      - etherhawk-internal     # reach the sandbox (no-egress net)

  # ── Interactive REAL Chrome (noVNC) + CDP capture ─────────────────────────────
  # Analyst-drivable real Google Chrome. Keeps its genuine TLS fingerprint (no
  # TLS-terminating proxy), which is what gets past server-side anti-analysis
  # cloaking. Egresses via the host's residential public IP. Serves BOTH the
  # auto-mode /visit endpoint and the interactive /session endpoints on :9001,
  # and the noVNC desktop on :6901.
  etherhawk-interactive:
    build:
      context: ./interactive
      dockerfile: Dockerfile
    container_name: etherhawk-interactive
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      - VNC_PW=${KASM_PASSWORD:-changeme-kasm}
      - CDP_PORT=9222
      - MITM_FLOWS_PATH=${MITM_FLOWS_PATH:-/workspace/_mitm/flows.jsonl}
    ports:
      - "${KASM_PORT:-6901}:6901"      # noVNC desktop (HTTPS, self-signed) — the analyst view
    volumes:
      - etherhawk-data:/workspace
    networks:
      - etherhawk-net                  # egress via host public IP + reachable by API

  # ── Deobfuscator (JS/PS beautify + IOC extraction) ────────────────────────────
  etherhawk-deobf:
    build:
      context: ./deobfuscator
      dockerfile: Dockerfile
    container_name: etherhawk-deobf
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - etherhawk-net

  # ── Isolated JS sandbox (NO network egress — internal net only) ───────────────
  etherhawk-sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: etherhawk-sandbox
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec
    networks:
      - etherhawk-internal     # internal:true → cannot reach the internet

volumes:
  etherhawk-data:
    driver: local

networks:
  etherhawk-net:
    driver: bridge             # has NAT egress via the host's public (residential) IP
  etherhawk-internal:
    driver: bridge
    internal: true             # sandbox cannot exfiltrate
