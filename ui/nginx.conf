server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise nginx version.
    server_tokens off;

    # SPA assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy (so the browser never needs CORS and the token
    # stays on one origin). SSE needs buffering off + long read timeout.
    location /api/ {
        proxy_pass http://etherhawk-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1800s;
        client_max_body_size 32m;
    }

    # mitmweb is intentionally NOT proxied here — it has no auth of its own. The
    # dashboard's MITM tab renders flows natively through the token-guarded /api.
}
