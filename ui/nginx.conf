server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise nginx version.
    server_tokens off;

    # noVNC analyst browser — proxy through nginx so the user never needs to
    # accept a self-signed cert. nginx handles the SSL internally (self-signed
    # cert is fine over the Docker internal network). WebSocket upgrades are
    # forwarded so the VNC canvas works.
    location /novnc/ {
        proxy_pass https://etherhawk-interactive:6901/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host etherhawk-interactive;
        proxy_set_header Authorization "Basic a2FzbV91c2VyOmNoYW5nZW1lLWthc20=";
        proxy_ssl_verify off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # kasmweb/noVNC WebSocket endpoint — the JS inside the iframe constructs its
    # WebSocket URL from window.location.hostname:port (10.100.20.3:8107) and
    # the configured path "websockify", so the upgrade request arrives here at
    # /websockify, NOT at /novnc/websockify. Proxy it to the kasmweb backend.
    location /websockify {
        proxy_pass https://etherhawk-interactive:6901/websockify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host etherhawk-interactive;
        proxy_set_header Authorization "Basic a2FzbV91c2VyOmNoYW5nZW1lLWthc20=";
        proxy_ssl_verify off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # SPA assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy (so the browser never needs CORS and the token
    # stays on one origin). SSE needs buffering off + long read timeout.
    location /api/ {
        proxy_pass http://etherhawk-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1800s;
        client_max_body_size 32m;
    }

    # mitmweb is intentionally NOT proxied here — it has no auth of its own. The
    # dashboard's MITM tab renders flows natively through the token-guarded /api.
}
